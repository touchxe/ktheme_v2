<!-- @dsCard group="Components" viewport="700x300" name="Button · Badge · Chip" subtitle="알약형 버튼 / 상태·분류 뱃지 / 필터 칩" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);padding:24px;letter-spacing:var(--ls-base);}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--text-body);text-transform:uppercase;margin:0 0 10px;}
  .grp{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px;}
  .grp:last-child{margin-bottom:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.가평교회 || Object.values(window).find(v => v && v.Button && v.Badge) || {};
  const { Button, Badge, FilterChip } = NS;
  const Arrow = () => (<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>);

  function Demo(){
    return (
      <div>
        <p className="lbl">Button</p>
        <div className="grp">
          <Button variant="dark">전체</Button>
          <Button variant="brand">예배순서</Button>
          <Button variant="dark" iconRight={<Arrow/>}>다시보기</Button>
          <Button variant="outline">새가족 등록</Button>
          <Button variant="ghost">방송순서</Button>
        </div>
        <div className="grp">
          <Button variant="brand" size="sm">sm</Button>
          <Button variant="brand" size="md">md</Button>
          <Button variant="brand" size="lg">lg</Button>
        </div>
        <p className="lbl">Badge</p>
        <div className="grp">
          <Badge variant="live" />
          <Badge variant="category" category="주일">주일예배</Badge>
          <Badge variant="category" category="수요">수요예배</Badge>
          <Badge variant="category" category="청년">청년예배</Badge>
          <Badge variant="solid">VOL 04</Badge>
          <Badge variant="soft">새가족</Badge>
          <Badge variant="outline">2026 봄</Badge>
        </div>
        <p className="lbl">Filter Chip</p>
        <div className="grp">
          <FilterChip active>전체</FilterChip>
          <FilterChip>주일예배</FilterChip>
          <FilterChip>수요예배</FilterChip>
          <FilterChip>새벽예배</FilterChip>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
