<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);padding:28px;letter-spacing:var(--ls-base);}
  .row{display:flex;align-items:center;gap:36px;}
  .lockup{display:flex;align-items:center;gap:10px;}
  .lockup img{width:48px;height:48px;object-fit:contain;}
  .name{font-weight:700;font-size:20px;color:var(--text-strong);}
  .en{color:var(--text-body);font-weight:500;font-size:13px;margin-left:4px;}
  .dark{background:var(--ink-900);border-radius:var(--radius-xl);padding:18px 22px;}
  .dark .name{color:#fff;}
  .dark .en{color:var(--text-on-dark-soft);}
</style></head>
<body>
  <div class="row">
    <div class="lockup"><img src="../assets/logo.png" alt="가평교회"><span class="name">가평교회<span class="en">GAPYEONG CHURCH</span></span></div>
    <div class="dark"><div class="lockup"><img src="../assets/logo.png" alt="가평교회"><span class="name">가평교회<span class="en">GAPYEONG CHURCH</span></span></div></div>
  </div>
</body></html>
