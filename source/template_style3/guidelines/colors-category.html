<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">

  .row{display:flex;gap:16px;}
  .sw{text-align:center;}
  .chip{width:64px;height:64px;border-radius:var(--radius-lg);box-shadow:var(--ring-inset);}
  .name{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:8px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--cat-sunday)"></div><div class="name">주일</div></div>
    <div class="sw"><div class="chip" style="background:var(--cat-wed)"></div><div class="name">수요</div></div>
    <div class="sw"><div class="chip" style="background:var(--cat-youth)"></div><div class="name">청년</div></div>
    <div class="sw"><div class="chip" style="background:var(--cat-dawn)"></div><div class="name">새벽</div></div>
    <div class="sw"><div class="chip" style="background:var(--cat-kids)"></div><div class="name">유년부</div></div>
    <div class="sw"><div class="chip" style="background:var(--cat-etc)"></div><div class="name">기타</div></div>
  </div>
</body></html>
