<!-- @dsCard group="Colors" viewport="700x150" subtitle="강조·링크·액션 — Brand 블루 + Accent" name="Brand & Accent" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);padding:20px;}
  .row{display:flex;gap:12px;}
  .sw{flex:1;}
  .chip{height:64px;border-radius:var(--radius-lg);box-shadow:var(--ring-inset);}
  .name{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:8px;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-body);}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--brand-500)"></div><div class="name">brand-500</div><div class="hex">#3A64F5</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-600)"></div><div class="name">brand-600</div><div class="hex">#2A4FD6</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-700)"></div><div class="name">brand-700</div><div class="hex">#1F3EB2</div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-red)"></div><div class="name">accent-red</div><div class="hex">#E23B3B</div></div>
  </div>
</body></html>
