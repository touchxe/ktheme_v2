<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);padding:24px;}
  .row{display:flex;align-items:flex-end;gap:24px;}
  .sw{text-align:center;}
  .box{width:80px;height:80px;background:var(--paper);border:1px solid var(--line);}
  .name{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:8px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md · 8</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg · 12</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl · 16</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-full)"></div><div class="name">full</div></div>
  </div>
</body></html>
