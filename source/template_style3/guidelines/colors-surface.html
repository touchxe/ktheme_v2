<!-- @dsCard group="Colors" viewport="700x150" subtitle="면·경계 — white / paper / line" name="Surface" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);padding:20px;}
  .row{display:flex;gap:12px;}
  .sw{flex:1;}
  .chip{height:64px;border-radius:var(--radius-lg);box-shadow:var(--ring-inset);}
  .name{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:8px;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-body);}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="name">white</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="name">paper</div><div class="hex">#F4F5F7</div></div>
    <div class="sw"><div class="chip" style="background:var(--line)"></div><div class="name">line</div><div class="hex">#E5E7EB</div></div>
    <div class="sw"></div>
  </div>
</body></html>
