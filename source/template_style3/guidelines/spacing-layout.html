<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);padding:24px;}
  .wrap{display:flex;flex-wrap:wrap;gap:12px;}
  .tok{padding:10px 14px;border-radius:var(--radius-md);background:var(--paper);font-size:13px;color:var(--text-strong);}
  .tok b{font-weight:600;}
  .tok span{font-family:var(--font-mono);font-size:11px;color:var(--text-body);margin-left:4px;}
</style></head>
<body>
  <div class="wrap">
    <div class="tok"><b>컨테이너</b><span>max-w 1240</span></div>
    <div class="tok"><b>좌우 패딩</b><span>24</span></div>
    <div class="tok"><b>그리드</b><span>12col · gap 24</span></div>
    <div class="tok"><b>헤더 높이</b><span>72</span></div>
    <div class="tok"><b>섹션 간격</b><span>56–80</span></div>
  </div>
</body></html>
