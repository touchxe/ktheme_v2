<!-- @dsCard group="Colors" viewport="700x150" subtitle="텍스트·어두운 면 — Ink 600~900" name="Ink 스케일" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--white);padding:20px;}
  .row{display:flex;gap:12px;}
  .sw{flex:1;}
  .chip{height:64px;border-radius:var(--radius-lg);box-shadow:var(--ring-inset);}
  .name{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:8px;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-body);}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink-900</div><div class="hex">#0E1320</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="name">ink-800</div><div class="hex">#171C2C</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">ink-700</div><div class="hex">#222A3F</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="name">ink-600</div><div class="hex">#384058</div></div>
  </div>
</body></html>
